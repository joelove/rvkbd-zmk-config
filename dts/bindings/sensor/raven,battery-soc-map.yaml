description: Map a battery voltage sensor to a state-of-charge percent

compatible: "raven,battery-soc-map"

properties:
  voltage-sensor:
    type: phandle
    required: true
    description: Sensor that reports SENSOR_CHAN_GAUGE_VOLTAGE

  voltage-mv:
    type: array
    required: true
    description: Battery voltages in millivolts, strictly decreasing (full to empty)

  percent:
    type: array
    required: true
    description: Percents matching voltage-mv, full to empty
