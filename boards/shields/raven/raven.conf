# Report the shield SoC map instead of ZMK's stock 3.45-4.20V linear curve.
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Uncomment the following lines to enable the Raven RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Raven OLED Display
# CONFIG_ZMK_DISPLAY=y
